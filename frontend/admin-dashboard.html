<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark"><div class="container-fluid px-4"><a class="navbar-brand fw-bold" href="#">Owner Dashboard<span class="brand-dot">.</span></a><div class="d-flex align-items-center gap-3"><span id="adminName" class="text-white small"></span><button id="logoutBtn" class="btn btn-outline-light btn-sm">Log out</button></div></div></nav><main class="container-fluid px-lg-4 py-4"><div id="message" class="alert d-none" role="alert"></div><div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4"><div><span class="eyebrow">OVERVIEW</span><h1 class="mt-2">Registrations</h1><p class="text-secondary mb-0">Live records retrieved from your MySQL database.</p></div><button id="exportBtn" class="btn btn-primary">Export CSV</button></div><div class="row g-3 mb-4"><div class="col-md-6"><div class="stat-card"><span>Total registered users</span><strong id="totalUsers">—</strong></div></div><div class="col-md-6"><div class="stat-card"><span>Registered today</span><strong id="todayUsers">—</strong></div></div></div><section class="panel p-3 p-lg-4"><div class="row g-3 mb-3"><div class="col-lg-4"><label class="form-label" for="search">Search</label><input class="form-control" id="search" placeholder="Name, email, username, mobile"></div><div class="col-lg-3"><label class="form-label" for="education">Education</label><input class="form-control" id="education" placeholder="Exact education value"></div><div class="col-lg-2"><label class="form-label" for="status">Status</label><select class="form-select" id="status"><option value="">All statuses</option><option>active</option><option>inactive</option><option>blocked</option></select></div><div class="col-lg-3"><label class="form-label" for="from">Registered from / to</label><div class="d-flex gap-2"><input class="form-control" type="date" id="from" aria-label="Registered from"><input class="form-control" type="date" id="to" aria-label="Registered to"></div></div><div class="col-12"><button class="btn btn-primary btn-sm" id="filterBtn">Apply filters</button><button class="btn btn-outline-secondary btn-sm ms-2" id="resetBtn">Reset</button></div></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Mobile</th><th>Education</th><th>Status</th><th>Registered</th><th>Actions</th></tr></thead><tbody id="usersBody"><tr><td colspan="8">Loading…</td></tr></tbody></table></div><div class="d-flex justify-content-between align-items-center gap-3"><small id="pageInfo" class="text-secondary"></small><div class="d-flex gap-2"><button id="prevBtn" class="btn btn-outline-secondary btn-sm">Previous</button><button id="nextBtn" class="btn btn-outline-secondary btn-sm">Next</button></div></div></section><section class="panel p-3 p-lg-4 mt-4"><h2 class="h5">Recent registrations</h2><div id="recentList" class="small text-secondary">Loading…</div></section></main><div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5">Registration details / edit</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body" id="modalBody"></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button><button type="button" class="btn btn-primary" id="saveUserBtn">Save changes</button></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/config.js"></script><script src="js/admin.js"></script></body></html>
