<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="index.html">Register<span class="brand-dot">.</span></a></div></nav><main class="container py-5"><div class="login-shell mx-auto"><span class="eyebrow">PRIVATE AREA</span><h1 class="mt-2">Owner sign in</h1><p class="text-secondary">Sign in with the administrator account created by the setup script.</p><div id="message" class="alert d-none" role="alert"></div><form id="loginForm"><div class="mb-3"><label class="form-label" for="username">Admin username</label><input class="form-control" id="username" name="username" autocomplete="username" required maxlength="60"></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required></div><button class="btn btn-primary w-100 py-2" id="submitBtn">Sign in</button></form><a class="small d-inline-block mt-3" href="index.html">Back to registration</a></div></main><script src="js/config.js"></script><script src="js/login.js"></script></body></html>
